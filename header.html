{% load static %}
{% block header %}

<!-- ces codes ce pour la barre de navigation seulement -->

<header class="main_menu home_menu">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <nav class="navbar navbar-expand-lg navbar-light">
                    <a class="navbar-brand" href="#"> <img src="{% static 'img/OFF.png'%}"></img>
                    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse main-menu-item" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item active">
                                <a class="nav-link" href="{% url 'home' %}"><strong>Acceuil</strong><span class="sr-only">(current)</span></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'about' %}"><strong>A propos</strong></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'service' %}"><strong>Nos services</strong></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link page-scroll" href="{% url 'catalogue' %}"><strong>Catalogue</strong></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'contact' %}"><strong>Contacts</strong></a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>

<style>
  .main_menu {
    background-color:rgb(245, 252, 255);
    padding: 0,5rem 0;
    position: sticky; 
    top: 0;
    z-index: 100; 
  }
  
  .main_menu .navbar-brand img {
    max-width: 135px;
    height: auto;
    transition: transform 0.3s ease;
   }
  
  .main_menu .navbar-brand:hover img {
    transform: scale(1.05); 
  }
  
  .main_menu .navbar-nav {
    margin-left: auto;
  }
  
  .main_menu .navbar-nav .nav-item {
    margin-left: 1rem;
    display: flex;
  }
  
  .main_menu .navbar-nav .nav-link {
    color: #fff; 
    font-weight: bold;
    padding: 0.5rem 0;
    position: relative; 
    transition: color 0.3s ease;
  }
  
  .main_menu .navbar-nav .nav-link:hover,
  .main_menu .navbar-nav .nav-link.active {
    color: #834b02;
  }
  
  .main_menu .navbar-nav .nav-link::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background-color: #834b02; 
    transition: width 0.3s ease; 
  }
  
  .main_menu .navbar-nav .nav-link:hover::before,
  .main_menu .navbar-nav .nav-link.active::before {
    width: 100%; 
  }
  
  .main_menu .navbar-toggler {
    border: none;
    padding: 0;
  }
  
  .main_menu .navbar-toggler-icon {
    background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3cpath stroke='rgba(255, 255, 255, 1)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    padding-left: 400px;
  }
  /* @media (min-width: 576px) {
    .main_menu .navbar-toggler-icon {
      padding-left: 500px;
      }
   */
  /* --- Media Queries (pour le resposive. au cas ou on est sur un portable) --- */
  @media (max-width: 991px) {
    .main_menu .navbar-nav {
      text-align: center; /* Center menu items on mobile */
    }
    /* .main_menu .navbar-brand img {
    max-width: 110px;
    height: auto;
    transition: transform 0.3s ease;
   } */
  
    .main_menu .navbar-nav .nav-item {
      margin-left: 0;
      margin-bottom: 1rem; /* Space between menu items on mobile */
    }
    .main_menu .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3cpath stroke='rgba(131, 75, 2, 1)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
      align-content: end;
    }
  }
 
</style>

{% endblock header %}
